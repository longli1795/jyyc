<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 企业经营预测分析平台</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --primary-hover: #3498db;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-hover) 100%);
            color: #fff;
            text-align: center;
            padding: 36px 24px 28px;
        }

        .login-header .icon-circle {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 28px;
        }

        .login-header h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .login-header p {
            font-size: 13px;
            opacity: 0.85;
            margin: 0;
        }

        .login-body {
            padding: 32px 28px 36px;
        }

        .form-floating {
            margin-bottom: 18px;
        }

        .form-floating .form-control {
            border-radius: 10px;
            border: 1.5px solid var(--border-color);
            padding: 16px 14px 6px 44px;
            height: 54px;
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-floating .form-control:focus {
            border-color: var(--primary-hover);
            box-shadow: 0 0 0 3px rgba(52,152,219,0.15);
        }

        .form-floating label {
            padding-left: 44px;
            color: var(--text-secondary);
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 16px;
            z-index: 5;
            pointer-events: none;
        }

        .form-floating { position: relative; }

        .btn-login {
            width: 100%;
            height: 48px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-hover) 100%);
            border: none;
            color: #fff;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            margin-top: 6px;
        }

        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(52,152,219,0.35);
            color: #fff;
        }

        .btn-login:active { transform: translateY(0); }

        .alert-error {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 14px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .login-footer {
            text-align: center;
            padding: 0 28px 24px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            z-index: 5;
            font-size: 15px;
            padding: 4px;
        }

        .toggle-password:hover { color: var(--primary-hover); }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <!-- 头部 -->
            <div class="login-header">
                <div class="icon-circle">
                    <i class="fas fa-chart-line"></i>
                </div>
                <h2>企业经营预测分析平台</h2>
                <p>Business Forecast Analysis Platform</p>
            </div>

            <!-- 表单区 -->
            <div class="login-body">
                {% if error %}
                <div class="alert-error">
                    <i class="fas fa-exclamation-circle"></i>
                    <span>{{ error }}</span>
                </div>
                {% endif %}

                <form method="POST" action="{{ url_for('auth.login_action', next=request.args.get('next', '')) }}" autocomplete="off">
                    <div class="form-floating">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" class="form-control" id="username" name="username"
                               placeholder="用户名" value="{{ username|default('') }}" autofocus required>
                        <label for="username">用户名</label>
                    </div>

                    <div class="form-floating">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="密码" required>
                        <label for="password">密码</label>
                        <button type="button" class="toggle-password" onclick="togglePwd()">
                            <i class="fas fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>

                    <button type="submit" class="btn btn-login">
                        <i class="fas fa-sign-in-alt me-1"></i> 登 录
                    </button>
                </form>
            </div>

            <div class="login-footer">
                &copy; 2026 企业经营预测分析平台
            </div>
        </div>
    </div>

    <script>
        function togglePwd() {
            const inp = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (inp.type === 'password') {
                inp.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                inp.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // 回车提交
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('form').submit();
            }
        });
    </script>
</body>
</html>
